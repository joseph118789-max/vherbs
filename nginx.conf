# VHerbs nginx config — static site, gzip + cache headers.
# Listens on 8080 to match the Dockerfile EXPOSE.

# IMPORTANT — add_header inheritance quirk:
# In nginx, when a `location` block defines ANY add_header directive, it
# completely REPLACES (does not augment) all add_header directives inherited
# from the enclosing `server` block. So if a location adds `Cache-Control`,
# the security headers from `server { }` are dropped on that location's
# responses.
#
# Fix used here: each `location` block that defines its own add_header also
# re-declares the four security headers. Don't "clean this up" by moving
# them back to server-only — they'll silently disappear again.
#
# See: https://nginx.org/en/docs/http/ngx_http_headers_module.html#add_header
# ("If the server, location, or `if` block already defines them...")

worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Logging
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';
    access_log /var/log/nginx/access.log main;

    # Performance
    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout 65;
    server_tokens off;

    # Gzip — compress text responses
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml;

    server {
        listen       8080;
        server_name  vherbs.com.my www.vherbs.com.my;

        root   /usr/share/nginx/html;
        index  index.html;

        # === Security headers — repeated in every location block below ===
        # See the inheritance-quirk note at the top of this file.
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options        "SAMEORIGIN" always;
        add_header Referrer-Policy        "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self'; script-src 'self'; font-src 'self';" always;

        # Cache hashed assets aggressively (CSS/JS/images/icons)
        location ~* \.(?:css|js|jpg|jpeg|png|gif|svg|ico|webp)$ {
            expires 30d;
            add_header X-Content-Type-Options "nosniff" always;
            add_header X-Frame-Options        "SAMEORIGIN" always;
            add_header Referrer-Policy        "strict-origin-when-cross-origin" always;
            add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self'; script-src 'self'; font-src 'self';" always;
            add_header Cache-Control "public, max-age=2592000, immutable";
            access_log off;
        }

        # HTML — short cache so updates roll out quickly
        location ~* \.html$ {
            expires 1h;
            add_header X-Content-Type-Options "nosniff" always;
            add_header X-Frame-Options        "SAMEORIGIN" always;
            add_header Referrer-Policy        "strict-origin-when-cross-origin" always;
            add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self'; script-src 'self'; font-src 'self';" always;
            add_header Cache-Control "public, max-age=3600";
        }

        # Don't serve dotfiles
        location ~ /\. {
            deny all;
            access_log off;
            log_not_found off;
        }

        # Pretty URLs: fall back to index.html for any unknown path
        location / {
            try_files $uri $uri/ /index.html;
            # Security headers also needed for the fallback response
            add_header X-Content-Type-Options "nosniff" always;
            add_header X-Frame-Options        "SAMEORIGIN" always;
            add_header Referrer-Policy        "strict-origin-when-cross-origin" always;
            add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self'; script-src 'self'; font-src 'self';" always;
        }
    }
}